<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a2e"/>
      <stop offset="50%" style="stop-color:#1a1a4e"/>
      <stop offset="100%" style="stop-color:#0d0d3d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d4ff"/>
      <stop offset="100%" style="stop-color:#7b2ff7"/>
    </linearGradient>
    <linearGradient id="accent2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff6b6b"/>
      <stop offset="100%" style="stop-color:#ffa500"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="600" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="4" fill="url(#accent)"/>
  <rect x="0" y="596" width="1200" height="4" fill="url(#accent)"/>
  <circle cx="100" cy="100" r="150" fill="#00d4ff" opacity="0.03"/>
  <circle cx="1100" cy="500" r="200" fill="#7b2ff7" opacity="0.03"/>
  <circle cx="600" cy="300" r="300" fill="#ff6b6b" opacity="0.02"/>
  <g transform="translate(600, 240)">
    <text x="0" y="0" text-anchor="middle" font-family="monospace, 'Courier New'" font-size="72" font-weight="bold" fill="#ffffff" letter-spacing="2">
      AI Skill Engineer
    </text>
    <text x="0" y="50" text-anchor="middle" font-family="monospace, 'Courier New'" font-size="22" fill="#a0a0c0" letter-spacing="4">
      AUTONOMOUS ENGINEERING FRAMEWORK
    </text>
  </g>
  <g transform="translate(600, 340)" font-family="monospace, 'Courier New'" font-size="16" fill="#6060a0">
    <text x="0" y="0" text-anchor="middle">✦  Transform ideas into production-ready applications ✦</text>
  </g>
  <g transform="translate(600, 400)">
    <rect x="-200" y="-30" width="400" height="60" rx="8" fill="none" stroke="url(#accent)" stroke-width="2" opacity="0.5"/>
    <text x="0" y="5" text-anchor="middle" font-family="monospace, 'Courier New'" font-size="18" fill="url(#accent)">
      npm install -g ai-skill-engineer
    </text>
  </g>
  <g transform="translate(600, 470)" font-family="monospace, 'Courier New'" font-size="13" fill="#404080">
    <text x="-300" y="0" text-anchor="middle">24 Skills</text>
    <text x="-100" y="0" text-anchor="middle">10 Phases</text>
    <text x="100" y="0" text-anchor="middle">DAG Execution</text>
    <text x="300" y="0" text-anchor="middle">TypeScript</text>
  </g>
  <rect x="0" y="550" width="1200" height="50" fill="#050520" opacity="0.5"/>
  <text x="600" y="580" text-anchor="middle" font-family="monospace, 'Courier New'" font-size="12" fill="#404060">
    Idea → Understand → Plan → Build → Review → Fix → Validate → Approve → Optimize → Deliver
  </text>
</svg>
