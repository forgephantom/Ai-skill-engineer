---
# =============================================================================
# INGRESS (Optional)
# =============================================================================

# base/ingress.yaml
{{#if INGRESS_ENABLED}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{INGRESS_NAME}}
  namespace: {{NAMESPACE}}
  labels:
    app.kubernetes.io/name: {{PROJECT_NAME}}
  annotations:
    {{#each INGRESS_ANNOTATIONS}}
    {{KEY}}: "{{VALUE}}"
    {{/each}}
spec:
  ingressClassName: {{INGRESS_CLASS}}
  tls:
    - hosts:
        - {{HOST}}
      secretName: {{TLS_SECRET_NAME}}
  rules:
    - host: {{HOST}}
      http:
        paths:
          - path: {{PATH}}
            pathType: {{PATH_TYPE}}
            backend:
              service:
                name: {{SERVICE_NAME}}
                port:
                  number: {{SERVICE_PORT}}
{{/if}}